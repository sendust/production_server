<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sendust launcher</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ump.css">
</head>
<body>
<div class="lnch">
  <div class="logo">sendust<small>playlist</small></div>

  <div class="sysbox" id="sys">
    <div class="r"><span class="k">CasparCG</span><span id="s-amcp" class="bad">●</span></div>
    <div class="r" title="CasparCG 서버 프로세스가 시작된 뒤 지난 시간 (재시작/크래시 확인용)"><span class="k">Age</span><span id="s-cage">-</span></div>
    <div class="r"><span class="k">OSC</span><span id="s-osc" class="bad">●</span></div>
    <div class="sec">
      <div class="r"><span class="k">CPU</span><span id="s-cpu">-</span></div>
      <canvas class="g g-cpu" id="g-cpu"></canvas>
      <div class="lg"><span><i style="background:#3987e5"></i>코어별</span><span><i style="background:#f2c94c"></i>전체 60초</span></div>
    </div>
    <div class="r"><span class="k">RAM free</span><span id="s-mem">-</span></div>
    <div class="sec">
      <div class="r"><span class="k">GPU</span><span id="s-gput">-</span></div>
      <div class="gb" id="gb-gpu"><span>GPU</span><i><b></b></i><em>-</em></div>
      <div class="gb" id="gb-enc"><span>ENC</span><i><b></b></i><em>-</em></div>
      <div class="gb" id="gb-dec"><span>DEC</span><i><b></b></i><em>-</em></div>
      <div class="gb" id="gb-vram"><span>VRAM</span><i><b></b></i><em>-</em></div>
    </div>
    <div class="sec">
      <div class="r"><span class="k">Media</span><span id="s-disk">-</span></div>
      <div class="gb disk" id="gb-disk"><i><b></b></i></div>
      <div class="sub" id="s-disk2"></div>
    </div>
    <div id="nics"></div>
  </div>

  <button class="ubtn" id="b-log" title="로그 뷰어 창">로그 뷰어</button>
  <button class="ubtn" id="b-browser" title="미디어 브라우저 창">미디어 브라우저</button>
  <hr>
  <div class="host" id="host">-</div>
  <button class="ubtn" id="b-all" title="모든 재생 창을 화면에 나란히 엽니다">일괄 실행</button>
  <button class="ubtn" id="b-close" title="런처가 연 창을 모두 닫습니다">모두 종료</button>
  <hr>
  <div id="chs" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="ubtn sm hidden" id="b-self" title="이 런처를 왼쪽에 붙는 좁은 창으로 다시 엽니다" style="margin-top:8px">런처 창으로</button>

  <div class="foot"><div class="clock" id="clock"></div><div id="stamp"></div><span id="d-ws-wrap"><i class="dot" id="d-ws"></i>WS</span></div>
</div>
<script type="module">
import { $, $$, connectWs, esc, fmtBytes } from "./js/common.js";

const LW = 150;                 // launcher width: windows are tiled to its right
const wins = {};                // name -> Window opened from here
const bc = "BroadcastChannel" in window ? new BroadcastChannel("sendust") : null;
let info = null, players = [];

function scr() {
  const s = window.screen;
  return { x: s.availLeft ?? 0, y: s.availTop ?? 0, w: s.availWidth, h: s.availHeight };
}
function open(name, url, r) {
  const w = window.open(url, name, `popup,left=${Math.round(r.x)},top=${Math.round(r.y)},width=${Math.round(r.w)},height=${Math.round(r.h)}`);
  if (w) { wins[name] = w; try { w.focus(); } catch { /* cross-window */ } }
  return w;
}
// rectangles: PLAY windows share the screen right of the launcher; browser / log open over them
function playRect(i) {
  const s = scr(), n = Math.max(1, info?.channels.length ?? 1), W = Math.floor((s.w - LW) / n);
  return { x: s.x + LW + i * W, y: s.y, w: W, h: s.h };
}
const openPlay = (idx, i) => open(`sendust_player_${idx}`, `/player.html?ch=${idx}`, playRect(i));
const openBrowser = () => { const s = scr(); return open("sendust_browser", "/browser.html", { x: s.x + LW, y: s.y, w: Math.min(1400, s.w - LW), h: Math.round(s.h * 0.9) }); };
const openLog = () => { const s = scr(); const h = Math.round(s.h * 0.4); return open("sendust_log", "/log.html", { x: s.x + LW, y: s.y + s.h - h, w: s.w - LW, h }); };

$("#b-browser").onclick = openBrowser;
$("#b-log").onclick = openLog;
$("#b-all").onclick = () => (info?.channels ?? []).forEach((c, i) => openPlay(c.channel_index, i));
$("#b-close").onclick = () => {
  for (const w of Object.values(wins)) { try { w.close(); } catch { /* gone */ } }
  bc?.postMessage({ cmd: "close" });   // windows opened before a launcher reload close themselves
};

// opened as a normal tab: offer to re-open as a narrow popup on the left
if (!window.opener && window.outerWidth > 400) {
  const b = $("#b-self");
  b.classList.remove("hidden");
  b.onclick = () => { const s = scr(); if (window.open("/launcher.html", "sendust_launcher", `popup,left=${s.x},top=${s.y},width=${LW},height=${s.h}`)) window.close(); };
}

function renderChannels() {
  $("#chs").innerHTML = (info?.channels ?? []).map((c, i) => {
    const p = players.find(x => x.idx === c.channel_index);
    const st = p?.status ?? "empty";
    const cls = st === "playing" ? "playing" : st === "paused" ? "paused" : st === "ended" ? "ended" : "";
    const sub = st === "empty" ? "EJECT" : st.toUpperCase();
    return `<button class="ubtn chbtn ${cls}" data-idx="${c.channel_index}" data-i="${i}" title="${esc(p?.clip ?? "")}">${esc(c.name.replace(/\s+/g, "-"))}<small>${esc(sub)}</small></button>`;
  }).join("");
  $$("#chs [data-idx]").forEach(b => b.onclick = () => openPlay(Number(b.dataset.idx), Number(b.dataset.i)));
}

const age = s => {   // CasparCG process age: 45s / 12m 05s / 3h 07m / 2d 04h
  if (s == null) return "not running";
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60, p = x => String(x).padStart(2, "0");
  return d ? `${d}d ${p(h)}h` : h ? `${h}h ${p(m)}m` : m ? `${m}m ${p(s % 60)}s` : `${s}s`;
};
const pct = v => v == null ? "-" : `${v.toFixed(0)}%`;
const RX = "#3987e5", TX = "#d95926", BAR = "#3987e5", TRACK = "#2a2d31";   // dark-validated pair (dataviz)
const bps = v => v == null ? "-" : v >= 1e9 ? `${(v / 1e9).toFixed(2)}G` : v >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : `${(v / 1e3).toFixed(0)}k`;
const nicHist = new Map();   // name -> [{rx, tx}] last 60 s

function canvas2d(c) {
  const dpr = devicePixelRatio || 1, r = c.getBoundingClientRect();
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}

// one bar per logical core (height = load now) with the total CPU of the last 60 s overlaid as a line
const CPU_LINE = "#f2c94c";
const cpuHist = [];
function drawCpu(per, total) {
  const c = $("#g-cpu");
  const [g, w, h] = canvas2d(c);
  if (total != null) { cpuHist.push(total); if (cpuHist.length > 60) cpuHist.shift(); }
  if (!per?.length) return;
  const n = per.length, gap = n > 48 ? 0 : 1, bw = Math.max(1, (w - gap * (n - 1)) / n);
  per.forEach((v, i) => {
    const x = i * (bw + gap);
    g.fillStyle = TRACK; g.fillRect(x, 0, bw, h);
    const bh = Math.max(v > 0 ? 1 : 0, h * Math.min(100, v) / 100);
    g.fillStyle = v >= 90 ? "#e66767" : BAR;
    g.globalAlpha = .75;
    g.fillRect(x, h - bh, bw, bh);
    g.globalAlpha = 1;
  });
  if (cpuHist.length > 1) {   // same 0-100 % scale as the bars, newest at the right edge
    const pts = cpuHist.map((v, i) => [w - (cpuHist.length - 1 - i) * (w / 59), h - 1 - Math.min(100, v) / 100 * (h - 2)]);
    g.lineJoin = "round";
    for (const [col, lw] of [["#000a", 3.5], [CPU_LINE, 1.75]]) {   // dark halo keeps it readable over the bars
      g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
      pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
      g.stroke();
    }
  }
  c.title = `total ${total?.toFixed(0) ?? "-"}% (line: last 60 s)\n` + per.map((v, i) => `core ${i}: ${v.toFixed(0)}%`).join("\n");
}

function setBar(id, frac, text, title) {
  const el = $(id);
  el.querySelector("b").style.width = `${Math.max(0, Math.min(1, frac || 0)) * 100}%`;
  const em = el.querySelector("em");
  if (em) em.textContent = text;
  el.title = title || text;
}

// RX / TX of the last 60 s, both on one Mb/s scale
function drawNics(nics) {
  const box = $("#nics");
  const up = nics.filter(n => n.ips.length);
  const names = up.map(n => n.name).join(",");
  if (box.dataset.names !== names) {
    box.dataset.names = names;
    box.innerHTML = up.map(n => `<div class="sec nic" data-nic="${esc(n.name)}">
      <div class="r"><span class="k">${esc(n.name)}</span><span class="sub">${n.speed_mbps ? (n.speed_mbps >= 1000 ? n.speed_mbps / 1000 + "G" : n.speed_mbps + "M") : ""}</span></div>
      <canvas class="g g-nic"></canvas>
      <div class="lg"><span><i style="background:${RX}"></i>RX <b class="rx">-</b></span><span><i style="background:${TX}"></i>TX <b class="tx">-</b></span></div></div>`).join("");
  }
  for (const n of up) {
    const h = nicHist.get(n.name) || [];
    h.push({ rx: n.rx_bps, tx: n.tx_bps });
    if (h.length > 60) h.shift();
    nicHist.set(n.name, h);
    const el = box.querySelector(`[data-nic="${CSS.escape(n.name)}"]`);
    el.querySelector(".rx").textContent = bps(n.rx_bps);
    el.querySelector(".tx").textContent = bps(n.tx_bps);
    const c = el.querySelector("canvas");
    const [g, w, hh] = canvas2d(c);
    const max = Math.max(1e6, ...h.map(p => Math.max(p.rx, p.tx))) * 1.1;
    g.fillStyle = TRACK; g.fillRect(0, hh - 1, w, 1);
    const line = (key, col) => {
      g.strokeStyle = col; g.lineWidth = 1.5; g.lineJoin = "round"; g.beginPath();
      h.forEach((p, i) => { const x = w - (h.length - 1 - i) * (w / 59), y = hh - 1 - (p[key] / max) * (hh - 3);
        i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    };
    line("rx", RX); line("tx", TX);
    c.title = `${n.name} ${n.ips.join(", ")}\nRX ${bps(n.rx_bps)}b/s  TX ${bps(n.tx_bps)}b/s\nscale 0–${bps(max)}b/s, last 60 s`;
  }
}
connectWs(m => {
  if (m.type === "hello") {
    info = m.info;
    document.title = `${info.title} [Launcher] {${info.stamp}}`;
    $("#host").textContent = info.host;
    $("#stamp").textContent = info.stamp;
    renderChannels();
  }
  const s = m.type === "hello" ? m.sys : m.type === "sys" ? m : null;
  if (!s) return;
  const sy = s.sys || {};
  $("#s-cage").textContent = age(s.caspar_age);
  $("#s-cage").className = s.caspar_age == null ? "bad" : "";
  $("#s-amcp").className = s.amcp ? "ok" : "bad";
  $("#s-amcp").textContent = s.amcp ? "● ON" : "● OFF";
  $("#s-osc").className = s.osc ? "ok" : "bad";
  $("#s-osc").textContent = s.osc ? "● ON" : "● OFF";
  $("#s-cpu").textContent = pct(sy.cpu_percent);
  $("#s-cpu").className = sy.cpu_percent > 85 ? "bad" : sy.cpu_percent > 65 ? "warn" : "";
  $("#s-mem").textContent = sy.mem_available != null ? fmtBytes(sy.mem_available) : "-";
  drawCpu(sy.cpu_per, sy.cpu_percent);
  const g = (sy.gpus || [])[0];
  $("#s-gput").textContent = g ? (g.temp_c != null ? `${g.temp_c.toFixed(0)}°C` : "") : "none";
  $("#s-gput").className = g?.temp_c > 85 ? "bad" : g?.temp_c > 75 ? "warn" : "";
  $("#s-gput").title = g ? `${g.name}${g.power_w != null ? ` · ${g.power_w.toFixed(0)} W` : ""}` : "";
  setBar("#gb-gpu", (g?.util_gpu ?? 0) / 100, pct(g?.util_gpu), "GPU 3D/compute");
  setBar("#gb-enc", (g?.util_enc ?? 0) / 100, pct(g?.util_enc), "NVENC");
  setBar("#gb-dec", (g?.util_dec ?? 0) / 100, pct(g?.util_dec), "NVDEC");
  const vr = g?.mem_total_mib ? g.mem_used_mib / g.mem_total_mib : 0;
  setBar("#gb-vram", vr, g?.mem_total_mib ? `${(vr * 100).toFixed(0)}%` : "-",
    g?.mem_total_mib ? `VRAM ${(g.mem_used_mib / 1024).toFixed(1)} / ${(g.mem_total_mib / 1024).toFixed(1)} GB` : "");
  const d = s.media_disk;
  const freeFrac = d ? d.free / d.total : 1;
  $("#s-disk").textContent = d ? (freeFrac < 0.05 ? "LOW" : freeFrac < 0.15 ? "low" : "") : "-";
  $("#s-disk").className = freeFrac < 0.05 ? "bad" : freeFrac < 0.15 ? "warn" : "";
  setBar("#gb-disk", d ? 1 - freeFrac : 0, "", d ? `used ${fmtBytes(d.total - d.free)} / ${fmtBytes(d.total)}` : "");
  $("#gb-disk").classList.toggle("low", freeFrac < 0.15);
  $("#s-disk2").textContent = d ? `free ${fmtBytes(d.free)} / ${fmtBytes(d.total)}` : "";
  drawNics(sy.nics || []);
  $("#sys").title = `${sy.hostname ?? ""}\n${sy.cpu_model ?? ""}\n${(sy.nics || []).map(n => `${n.name}: ${n.ips.join(", ")}`).join("\n")}`;
  $("#clock").textContent = (sy.time || "").slice(11, 19);
  if (s.players && JSON.stringify(s.players) !== JSON.stringify(players)) { players = s.players; renderChannels(); }
}, on => $("#d-ws").classList.toggle("on", on));
</script>
</body>
</html>
