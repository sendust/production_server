<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sendust playlist [Media Browser]</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/sendust.svg">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ump.css">
<link rel="stylesheet" href="css/browser.css">
<link rel="stylesheet" href="css/theme.css">
<script>try { const t = localStorage.getItem("sp.theme.browser"); if (t && t !== "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="ub">
  <header class="ub-title">
    <span class="t">Media Browser</span>
    <span class="route" id="players"></span>
    <span class="sp"></span>
    <button class="themebtn" id="btn-theme">dark</button>
    <span class="dots"><span><i class="dot" id="d-ws"></i>WS</span><span><i class="dot" id="d-amcp"></i>AMCP</span></span>
  </header>

  <!-- upper: CasparCG media path (fixed) -->
  <section class="pane" id="pane-media" data-root="media">
    <div class="pane-head">
      <span class="plabel media">CasparCG MEDIA</span>
      <span class="crumbs mono"></span>
      <span class="sp"></span>
      <input class="filter" type="search" placeholder="filter">
      <button class="ibtn" data-op="refresh" title="새로고침 (F9)">⟳</button>
    </div>
    <div class="pane-body">
      <div class="tree" tabindex="0"></div>
      <div class="files">
        <div class="list fl" tabindex="0"><table>
          <thead><tr><th data-sort="name">파일명</th><th data-sort="ext">확장자</th><th data-sort="dur" class="r">Duration</th><th data-sort="size" class="r">Size</th><th data-sort="mtime" class="r">수정날짜</th></tr></thead>
          <tbody></tbody></table></div>
        <div class="pane-tools">
          <button class="ubtn sm" data-op="mkdir" title="새 폴더 (F7)">+ 폴더</button>
          <button class="ubtn sm" data-op="rename" title="이름 변경 (F2)">이름변경</button>
          <button class="ubtn sm red" data-op="delete" title="삭제 (Del)">삭제</button>
          <button class="ubtn sm" data-op="url" title="선택한 파일의 스트리밍 URL 복사 — mpv / VLC 의 '네트워크 스트림 열기'에 붙여 넣기 (행을 플레이어로 끌어 놓아도 됨)">URL</button>
          <span class="sp"></span>
          <span class="sendto"></span>
          <span class="count dim mono"></span>
        </div>
      </div>
    </div>
    <div class="dropmask">PC 파일을 놓으면 이 폴더로 업로드</div>
  </section>

  <div class="vsplit" data-split="0" title="끌어서 높이 조절 (더블클릭: 기본 배치)"></div>

  <!-- lower: one favourite path -->
  <section class="pane" id="pane-fav" data-root="host">
    <div class="pane-head">
      <span class="plabel fav">즐겨찾기</span>
      <select class="uselect favsel" title="보여줄 즐겨찾기 경로"></select>
      <button class="ibtn" data-op="favadd" title="현재 폴더를 즐겨찾기에 추가">★+</button>
      <button class="ibtn" data-op="favdel" title="선택한 즐겨찾기 삭제">★−</button>
      <span class="crumbs mono"></span>
      <span class="sp"></span>
      <input class="filter" type="search" placeholder="filter">
      <button class="ibtn" data-op="refresh" title="새로고침">⟳</button>
    </div>
    <div class="pane-body">
      <div class="tree" tabindex="0"></div>
      <div class="files">
        <div class="list fl" tabindex="0"><table>
          <thead><tr><th data-sort="name">파일명</th><th data-sort="ext">확장자</th><th data-sort="dur" class="r"></th><th data-sort="size" class="r">Size</th><th data-sort="mtime" class="r">수정날짜</th></tr></thead>
          <tbody></tbody></table></div>
        <div class="pane-tools">
          <button class="ubtn sm" data-op="url" title="선택한 파일의 스트리밍 URL 복사 — mpv / VLC 의 '네트워크 스트림 열기'에 붙여 넣기 (행을 플레이어로 끌어 놓아도 됨)">URL</button>
          <button class="ubtn xfer" data-op="transfer" title="선택한 파일/폴더를 CasparCG MEDIA 의 현재 폴더로 복사 (F5)">▲ 전송하기 → CasparCG MEDIA</button>
          <span class="sp"></span>
          <span class="count dim mono"></span>
        </div>
      </div>
    </div>
  </section>

  <div class="vsplit" data-split="1" title="끌어서 높이 조절 (더블클릭: 기본 배치)"></div>

  <!-- transfer status -->
  <section class="xfers">
    <div class="xhead"><span class="tab">전송현황</span><span class="sp"></span><button class="ibtn" id="x-clear" title="완료된 항목 지우기">완료 지우기</button></div>
    <div class="list"><table>
      <thead><tr><th>원본</th><th class="c">Direction</th><th>대상</th><th class="c" style="width:200px">전송</th><th class="r">Size</th><th class="c">전송상태</th><th></th></tr></thead>
      <tbody id="xbody"></tbody></table></div>
  </section>
</div>
<script type="module" src="js/browser.js"></script>
</body>
</html>
