<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>sendust OSD</title>
<!-- Rendered by CasparCG's HTML producer on the OSD channel, on top of route://<clean>.
     Display only: the backend computes the TC/filename text and pushes it over SSE (/sse/osd).
     Positions/sizes are fractions of the frame (x, y = top-left; size = text height / frame height). -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .item { position: absolute; display: none; white-space: nowrap; line-height: 1.15; color: #fff;
          text-shadow: 0 0 .08em #000, 0 0 .08em #000; }
  .item.box { background: rgba(0, 0, 0, .55); padding: .08em .3em; border-radius: .12em; text-shadow: none; }
  #tc { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK KR", monospace; font-weight: 700; letter-spacing: .02em; }
  #tc .lbl { font-size: .45em; font-weight: 400; vertical-align: .55em; margin-right: .5em; opacity: .85; }
  #tc .lbl { color: #fff; }   /* white TC = MXF timecode */
  #tc.elapsed .lbl { color: #ff3b3b; font-weight: 700; opacity: 1; }   /* same as the playback window */
  #tc.paused { color: #ffc940; } #tc.ended { color: #ff6a5e; } #tc.empty { opacity: .5; }
  #fname { font-family: "Noto Sans CJK KR", "DejaVu Sans", sans-serif; font-weight: 500; }
</style>
</head>
<body>
<div id="tc" class="item"><span class="lbl"></span><span class="v"></span></div>
<div id="fname" class="item"></div>
<script>
const CH = Number(new URLSearchParams(location.search).get("ch") || 0);
const tc = document.getElementById("tc"), tcv = tc.querySelector(".v"), fn = document.getElementById("fname");
let box = false;

function place(el, c) {
  el.style.left = `${c.x * 100}vw`;
  el.style.top = `${c.y * 100}vh`;
  el.style.fontSize = `${c.size * 100}vh`;
}
function show(el, on) { const v = on ? "block" : "none"; if (el.style.display !== v) el.style.display = v; }
function text(el, t) { if (el.textContent !== t) el.textContent = t; }

const es = new EventSource(`/sse/osd?ch=${CH}`);   // reconnects by itself (server sends retry: 1000)
es.addEventListener("layout", e => {
  const l = JSON.parse(e.data);
  box = l.box;
  place(tc, l.tc); place(fn, l.fname);
  tc.querySelector(".lbl").textContent = l.label;
  fn.classList.toggle("box", box);
});
es.addEventListener("view", e => {
  const v = JSON.parse(e.data);
  show(fn, v.name != null);
  if (v.name != null) text(fn, v.name);
  show(tc, v.tc != null);
  if (v.tc != null) text(tcv, v.tc);
  const cls = `item ${box ? "box" : ""} ${v.st} ${v.mode}`;
  if (tc.className !== cls) tc.className = cls;
});
es.onerror = () => { show(tc, false); show(fn, false); };   // backend gone: no frozen TC on air
</script>
</body>
</html>
