<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sendust playlist</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="chname" id="chname">PLAY</span>
    <span class="route" id="route"></span>
    <span class="conn">
      <span><i class="dot" id="d-ws"></i>WS</span>
      <span><i class="dot" id="d-amcp"></i>AMCP</span>
      <span><i class="dot" id="d-osc"></i>OSC</span>
      <button class="linkbtn" id="btn-browser" title="미디어 브라우저 창 열기">Media Browser</button>
    </span>
  </header>

  <section class="panel info">
    <div class="fname" id="fname">—</div>
    <div class="state" id="state">empty</div>
    <div class="meta" id="meta"></div>
  </section>

  <section class="panel transport">
    <div class="grp">
      <button class="tbtn danger" data-act="eject" title="Eject (clear layer)"><svg viewBox="0 0 24 24"><path d="M12 5l7 9H5zM5 16h14v3H5z"/></svg>EJECT</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="tbtn" data-act="top" title="Go to IN / top (Home)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>TOP</button>
      <button class="tbtn" data-step="-1s" title="-1 s (Shift+←, J)"><svg viewBox="0 0 24 24"><path d="M12 6v12L3 12zM21 6v12l-9-6z"/></svg>1s</button>
      <button class="tbtn" data-step="-1" title="-1 frame (←)"><svg viewBox="0 0 24 24"><path d="M16 6v12L7 12z"/></svg>1f</button>
      <button class="tbtn play" id="btn-play" data-act="toggle" title="Play / Pause (Space)"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg><span>PLAY</span></button>
      <button class="tbtn" data-step="1" title="+1 frame (→)">1f<svg viewBox="0 0 24 24"><path d="M8 6v12l9-6z"/></svg></button>
      <button class="tbtn" data-step="1s" title="+1 s (Shift+→, L when paused)">1s<svg viewBox="0 0 24 24"><path d="M3 6v12l9-6zM12 6v12l9-6z"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="tbtn in" data-act="mark_in" title="Mark IN (I)">IN</button>
      <button class="tbtn out" data-act="mark_out" title="Mark OUT (O)">OUT</button>
      <button class="tbtn" id="btn-goin" title="Go to IN (Ctrl+I)">→IN</button>
      <button class="tbtn" id="btn-goout" title="Go to OUT (Ctrl+O)">→OUT</button>
      <button class="tbtn" data-act="clear_marks" title="Clear IN/OUT">CLR</button>
    </div>
    <span class="sep"></span>
    <label>Loop
      <select id="loopmode" title="Loop play">
        <option value="none">none</option>
        <option value="single">single</option>
        <option value="playlist">playlist</option>
      </select>
    </label>
  </section>

  <canvas class="tl panel" id="timeline"></canvas>
  <section class="panel zoom">
    <div class="zoombar">
      <button class="ibtn" id="sc-run" title="playhead 앞뒤 ±N초의 장면 전환 + 오디오 peak 분석 ( / )">✂ SCENE</button>
      <label class="dim">± <input id="sc-range" type="number" min="1" max="30" step="1" title="분석 범위 (초, 앞뒤 각각)"> s</label>
      <label class="dim" title="컷으로 볼 scene 점수">thr <input id="sc-th" type="range" min="0.05" max="1" step="0.01"> <span class="mono" id="sc-th-v"></span></label>
      <label class="chk dim" title="일시정지 위치가 분석 구간 밖이면 자동으로 다시 분석"><input type="checkbox" id="sc-auto"> auto</label>
      <span class="dim mono" id="sc-info"></span>
      <span class="spacer"></span>
      <span class="dim keyhint">1-9 컷 · Shift+1-9 컷 직전 · Ctrl+←/→ 이전/다음 컷</span>
      <button class="ibtn" id="sc-close" title="닫기">✕</button>
    </div>
    <div class="sc-box" id="sc-box">
      <canvas id="sc-canvas"></canvas>
      <div id="sc-head" hidden></div>
      <div id="sc-hover" hidden></div>
      <div id="sc-empty" class="dim">/ 키 또는 ✂ SCENE: playhead 주변 장면 전환과 오디오 peak 를 프레임 단위로 표시</div>
    </div>
  </section>

  <section class="panel tcrow">
    <div class="tcbox"><span class="lbl">Timecode</span><span class="tc-main" id="tc">--:--:--:--</span></div>
    <div class="tcbox"><span class="lbl">Elapsed</span><span class="v" id="tc-el">--</span></div>
    <div class="tcbox rem" id="box-rem"><span class="lbl">Remaining</span><span class="v" id="tc-rem">--</span></div>
    <div class="tcbox in"><span class="lbl">In</span><span class="v" id="tc-in">--</span></div>
    <div class="tcbox out"><span class="lbl">Out</span><span class="v" id="tc-out">--</span></div>
    <div class="tcbox"><span class="lbl">Duration</span><span class="v" id="tc-dur">--</span></div>
    <div class="tcbox plinfo hidden" id="box-pl"><span class="lbl">Playlist</span><span class="v" id="tc-pl">--</span></div>
  </section>

  <section class="panel"><canvas class="meter" id="meter"></canvas></section>

  <section class="panel listwrap" id="plwrap">
    <div class="listhead pltools">
      <label class="chk" title="플레이리스트 연속 재생"><input type="checkbox" id="pl-enable"> Playlist play</label>
      <span class="sep"></span>
      <select id="pl-slot" title="플레이리스트 슬롯 (1~9: 이 서버, A~D: 공유)"></select>
      <button class="ibtn" id="pl-save" title="선택한 슬롯에 저장">SAVE</button>
      <button class="ibtn" id="pl-load" title="선택한 슬롯에서 불러오기">LOAD</button>
      <span class="sep"></span>
      <button class="ibtn" id="pl-cue" title="선택한 클립을 CasparCG 에 로드 (Enter / 더블클릭)">CUE ▸</button>
      <button class="ibtn" id="pl-pause" title="선택 위치 앞에 PAUSE 라인 삽입 (P)">+ PAUSE</button>
      <button class="ibtn" id="pl-preview" title="VGA 프리뷰 (V)" disabled>PREVIEW</button>
      <button class="ibtn danger" id="pl-del" title="선택 항목 삭제 (Del)">DEL</button>
      <button class="ibtn danger" id="pl-clear" title="전체 삭제">CLEAR</button>
      <span class="spacer"></span>
      <span class="dim mono" id="pl-total"></span>
    </div>
    <div class="list pl" id="pl" tabindex="0">
      <table>
        <thead><tr><th class="c-n">#</th><th>Name</th><th>Kind</th><th class="r">In</th><th class="r">Out</th><th class="r">Duration</th><th class="r" title="예상 송출 시각 (Playlist play 중)">On-air</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="pl-empty dim">미디어 브라우저에서 파일을 끌어다 놓으세요</div>
    </div>
  </section>

  <section class="panel">
    <div class="status" id="status"><span class="dim mono" id="status-t"></span><span class="msg" id="status-msg">ready</span><span class="dim">log ▾</span></div>
    <div class="logpane hidden" id="logpane"></div>
  </section>
</div>
<script type="module" src="js/player.js"></script>
</body>
</html>
